services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pollinate_owner
      POSTGRES_PASSWORD: pollinate_owner
      POSTGRES_DB: pollinate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollinate_owner -d pollinate"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
